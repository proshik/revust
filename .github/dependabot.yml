version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Crossterm has a local PTY-loss patch; update only after requalification.
      - dependency-name: crossterm
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
