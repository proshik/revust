[workspace]
members = ["crates/core", "crates/cli", "crates/executors", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
sha2 = "0.11.0"

nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "fs", "dir"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
crossterm = { path = "third_party/crossterm" }
