[package]
name = "revust-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
revust-core = { path = "../core" }
chrono = { workspace = true, features = ["clock"] }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm_0_29"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
# The local Crossterm patch reports PTY loss and bounds interrupted reads.
# Keep the poll reader used by existing terminal qualification.
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste", "use-dev-tty"] }
pulldown-cmark = { version = "0.13.4", default-features = false }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
